<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#02070c" />
  <meta name="description" content="NemlleA — Engine platform." />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <title>NemlleA | Engines</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <div class="ambient ambient-grid" aria-hidden="true"></div>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#/home" aria-label="NemlleA home">
        <img src="/logo.svg" alt="NemlleA" />
        <span>NemlleA</span>
      </a>
      <nav class="nav" aria-label="Основная навигация">
        <a href="#/home">Dashboard</a>
        <a href="#/engines">Engines</a>
        <a href="#/community">Community</a>
        <a href="#/docs">Docs</a>
      </nav>
      <div class="top-actions">
        <button class="icon-btn" id="searchBtn" aria-label="Поиск" title="Поиск">⌕</button>
        <button class="icon-btn" id="notifyBtn" aria-label="Уведомления" title="Уведомления">♧</button>
        <button class="profile-btn" id="profileBtn" aria-label="Профиль" title="Профиль"><span class="profile-icon">◯</span><span class="profile-chevron">⌄</span></button>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar" aria-label="Боковая навигация">
        <div class="side-section">
          <a class="side-link" href="#/engines"><span class="side-icon">◌</span><span>Engines</span></a>
          <a class="side-link" href="#/community"><span class="side-icon">♧</span><span>Community</span></a>
          <a class="side-link" href="#/docs"><span class="side-icon">▤</span><span>Documentation</span></a>
        </div>
        <div class="side-divider"></div>
        <div class="side-section secondary">
          <button class="side-link side-button" id="settingsBtn"><span class="side-icon">⚙</span><span>Settings</span></button>
          <button class="side-link side-button" id="helpBtn"><span class="side-icon">?</span><span>Help</span></button>
        </div>
      </aside>

      <main id="app" class="content"></main>
    </div>

    <footer class="footer">
      <div class="footer-brand"><img src="/logo.svg" alt="" /><span>NemlleA</span></div>
      <div class="build">Build 1.0.0 &nbsp;•&nbsp; © 2025 NemlleA. All rights reserved.</div>
      <div class="footer-links"><a href="#/privacy">Privacy</a><a href="#/developer">Terms</a><a href="#/developer">Contact</a></div>
    </footer>
  </div>
  <script src="/app.js"></script>
</body>
</html>
