[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nemllea-document-processing-engine"
version = "1.0.1"
description = "Standalone API-first document processing backend with safe async jobs, retry/cancellation and extensible adapters"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.128.2",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "uvicorn[standard]==0.48.0",
  "pypdf==6.19.0",
  "python-docx==1.2.0",
  "reportlab==5.0.1",
  "httpx==0.28.1",
  "python-multipart>=0.0.20,<1"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-q"

[tool.setuptools]
packages = ["core", "api", "adapters", "config", "workers"]
